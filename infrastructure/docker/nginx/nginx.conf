user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cloudflare Real IP Setup (For correct rate limiting)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Penerjemah nama container milik Docker.
    #
    # Sebelumnya ketiga layanan didaftarkan lewat blok `upstream`. Nginx
    # menerjemahkan nama container di sana SATU KALI saat menyala, lalu
    # menyimpan alamatnya selamanya. Begitu container aplikasi dibangun ulang
    # saat deploy, mereka mendapat alamat baru — sementara nginx masih menunjuk
    # alamat lama, yang kini bisa saja ditempati container yang berbeda.
    #
    # Akibatnya pernah terjadi di produksi: halaman utama diteruskan ke
    # container panel admin dan sebaliknya, sehingga keduanya menjawab 404
    # padahal aplikasinya sehat. Satu-satunya obatnya saat itu adalah
    # merestart nginx setiap habis deploy — mudah sekali terlupa.
    #
    # Dengan resolver ini plus alamat yang ditulis sebagai variabel di bawah,
    # nginx menerjemahkan ulang setiap 10 detik. Deploy tidak lagi menuntut
    # restart nginx, dan nginx juga tetap bisa menyala meski container
    # aplikasinya sedang mati.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP Server (Redirect to HTTPS and serve ACME challenge)
    server {
        listen 80;
        listen [::]:80;
        server_name bidku.co.id www.bidku.co.id;

        # Certbot HTTP-01 Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all HTTP requests to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- PRODUCTION HTTPS SERVER ---
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name bidku.co.id www.bidku.co.id;

        ssl_certificate /etc/letsencrypt/live/bidku.co.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bidku.co.id/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Alamat tujuan ditulis sebagai variabel agar nginx menerjemahkannya
        # ulang lewat resolver di atas, bukan sekali saat menyala. Karena
        # proxy_pass memakai variabel, jalur permintaan TIDAK lagi disambung
        # otomatis — itulah sebabnya $request_uri ditulis eksplisit di setiap
        # baris. Tanpa itu semua permintaan akan mendarat di halaman root.

        # Public Landing Page Website
        location / {
            set $svc_landing http://landing:3000;
            proxy_pass $svc_landing$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Control Panel Website
        location /admin {
            set $svc_admin http://admin:3000;
            proxy_pass $svc_admin$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend REST API
        location /api {
            limit_req zone=api_limit burst=20 nodelay;
            set $svc_api http://api:8000;
            proxy_pass $svc_api$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Bidding Connections
        location /socket.io {
            set $svc_socket http://api:8000;
            proxy_pass $svc_socket$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            # Siaran hitung mundur mengalir terus-menerus; jangan diputus
            # nginx di tengah lelang hanya karena dianggap menganggur.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
