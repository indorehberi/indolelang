version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: indolelang_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-indolelang_prod}
    ports:
      - '5432:5432'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: indolelang_redis_prod
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: indolelang_api_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8000:8000'
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@postgres:5432/${DB_NAME:-indolelang_prod}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your_super_production_secret_key}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your_super_production_refresh_secret_key}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=30d
      - API_PREFIX=/api/v1
    volumes:
      - uploads_prod:/app/apps/api/uploads

  admin:
    build:
      context: ../../
      dockerfile: apps/admin-panel/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8000}
    container_name: indolelang_admin_prod
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8000}

  landing:
    build:
      context: ../../
      dockerfile: apps/landing-web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8000}
        - NEXT_PUBLIC_ADMIN_URL=${PUBLIC_ADMIN_URL:-http://localhost:3001}
    container_name: indolelang_landing_prod
    restart: unless-stopped
    ports:
      - '3002:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_ADMIN_URL=${PUBLIC_ADMIN_URL:-http://localhost:3001}

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  uploads_prod:
    driver: local
