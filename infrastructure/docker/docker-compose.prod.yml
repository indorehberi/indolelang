version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: indolelang_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${DB_NAME:-indolelang_prod}
    ports:
      - '127.0.0.1:5432:5432' # Bind only to localhost for security
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: indolelang_redis_prod
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379' # Bind only to localhost for security
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: indolelang_api_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '8000' # Expose internally for Nginx proxy, do not publish ports directly
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgrespassword}@postgres:5432/${DB_NAME:-indolelang_prod}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your_super_production_secret_key}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your_super_production_refresh_secret_key}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=30d
      - API_PREFIX=/api/v1
    volumes:
      - uploads_prod:/app/apps/api/uploads
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  admin:
    build:
      context: ../../
      dockerfile: apps/admin-panel/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost}
    container_name: indolelang_admin_prod
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  landing:
    build:
      context: ../../
      dockerfile: apps/landing-web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost}
        - NEXT_PUBLIC_ADMIN_URL=${PUBLIC_ADMIN_URL:-http://localhost/admin}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${PUBLIC_GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
    container_name: indolelang_landing_prod
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost}
      - NEXT_PUBLIC_ADMIN_URL=${PUBLIC_ADMIN_URL:-http://localhost/admin}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${PUBLIC_GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: indolelang_nginx_prod
    restart: unless-stopped
    depends_on:
      - api
      - admin
      - landing
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/www/certbot:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  certbot:
    image: certbot/certbot
    container_name: indolelang_certbot_prod
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  uploads_prod:
    driver: local
  certbot_etc:
    driver: local
  certbot_var:
    driver: local
