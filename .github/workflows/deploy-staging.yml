name: Deploy to Staging

on:
  push:
    branches: [develop]

env:
  NODE_VERSION: '20'

jobs:
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Build API Docker image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t indolelang-api:staging-${{ github.sha }} \
            .

      - name: Build Admin Panel Docker image
        run: |
          docker build \
            -f apps/admin-panel/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL || 'http://localhost:8000' }} \
            -t indolelang-admin:staging-${{ github.sha }} \
            .

      - name: Run database migrations
        run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      # Placeholder: uncomment when staging server is configured
      # - name: Deploy to staging server
      #   run: |
      #     echo "Deploy API image: indolelang-api:staging-${{ github.sha }}"
      #     echo "Deploy Admin image: indolelang-admin:staging-${{ github.sha }}"
      #     # docker-compose -f infrastructure/docker/docker-compose.prod.yml up -d

      - name: Smoke test
        run: |
          echo "✅ Docker images built successfully"
          echo "   API:   indolelang-api:staging-${{ github.sha }}"
          echo "   Admin: indolelang-admin:staging-${{ github.sha }}"
          echo ""
          echo "⚠️  Actual deployment to staging server not yet configured."
          echo "   Configure STAGING_DATABASE_URL secret and uncomment deploy step."
