name: Flutter Android Build (APK & AAB)

on:
  push:
    branches:
      - main
      - 'feature/IND-*'
  pull_request:
    branches:
      - main

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (required for Flutter Android compilation)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Build Android APK (Debug & Release)
        run: |
          cd apps/mobile
          flutter build apk --debug
          flutter build apk --release

      - name: Build Android App Bundle (AAB - Play Store ready)
        run: |
          cd apps/mobile
          flutter build appbundle --release

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
