name: CI — Lint, Type Check, Test, Build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (API)
        run: npx eslint apps/api/src --ext .ts --max-warnings 0
        continue-on-error: false

      - name: Run ESLint (Admin Panel)
        run: cd apps/admin-panel && npx eslint src --ext .ts,.tsx --max-warnings 0
        continue-on-error: false

  type-check:
    name: 🔎 Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Type check API
        run: cd apps/api && npx tsc --noEmit

      - name: Type check Admin Panel
        run: cd apps/admin-panel && npx tsc --noEmit

  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: indolelang
          POSTGRES_PASSWORD: indolelang
          POSTGRES_DB: indolelang_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U indolelang -d indolelang_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Run database migrations
        run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://indolelang:indolelang@localhost:5432/indolelang_test

      - name: Run unit tests
        run: cd apps/api && npm test -- --coverage --forceExit
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://indolelang:indolelang@localhost:5432/indolelang_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-key-minimum-8-chars
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-minimum-8-chars
          PORT: '8000'
          API_PREFIX: /api/v1
          CORS_ORIGIN: http://localhost:3000

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: apps/api/coverage/

  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: cd apps/api && npx prisma generate

      - name: Build API
        run: cd apps/api && npm run build

      - name: Build Admin Panel
        run: cd apps/admin-panel && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
